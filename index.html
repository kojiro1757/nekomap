<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NekoMap – 野良猫マップ</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1117; --surface: #181c27; --surface2: #1f2435;
    --border: #2a3050; --text: #e8eaf0; --text-muted: #6b7490;
    --accent: #f0b429; --red: #ff4d6d; --blue: #4da6ff; --green: #3ddc84;
    --red-dim: rgba(255,77,109,0.15); --blue-dim: rgba(77,166,255,0.15); --green-dim: rgba(61,220,132,0.15);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Zen Kaku Gothic New',sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; overflow:hidden; user-select:none; }
  header { display:flex; align-items:center; justify-content:space-between; padding:0 20px; height:52px; background:var(--surface); border-bottom:1px solid var(--border); flex-shrink:0; z-index:100; }
  .logo { display:flex; align-items:center; gap:8px; font-size:18px; font-weight:900; letter-spacing:-0.5px; }
  .logo span { color:var(--accent); }
  .btn-post { background:var(--accent); color:#0f1117; border:none; border-radius:8px; padding:7px 16px; font-family:inherit; font-weight:700; font-size:13px; cursor:pointer; transition:opacity 0.15s; }
  .btn-post:hover { opacity:0.85; }
  .main { display:flex; flex:1; overflow:hidden; }
  .sidebar { width:300px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }
  .filter-bar { padding:14px 16px; border-bottom:1px solid var(--border); display:flex; flex-direction:column; gap:10px; }
  .filter-title { font-size:11px; font-weight:700; letter-spacing:1.5px; color:var(--text-muted); text-transform:uppercase; }
  .filter-chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { display:flex; align-items:center; gap:5px; padding:4px 10px; border-radius:20px; border:1.5px solid transparent; font-size:12px; font-weight:700; cursor:pointer; transition:all 0.15s; background:var(--surface2); color:var(--text-muted); }
  .chip.active-red   { border-color:var(--red);   color:var(--red);   background:var(--red-dim); }
  .chip.active-blue  { border-color:var(--blue);  color:var(--blue);  background:var(--blue-dim); }
  .chip.active-green { border-color:var(--green); color:var(--green); background:var(--green-dim); }
  .dot { width:8px; height:8px; border-radius:50%; }
  .dot-red { background:var(--red); } .dot-blue { background:var(--blue); } .dot-green { background:var(--green); }
  .time-filter { display:flex; gap:4px; }
  .time-btn { flex:1; padding:5px 0; border-radius:6px; border:1.5px solid var(--border); background:transparent; color:var(--text-muted); font-family:inherit; font-size:11px; font-weight:700; cursor:pointer; transition:all 0.15s; }
  .time-btn.active { border-color:var(--accent); color:var(--accent); background:rgba(240,180,41,0.1); }
  .sighting-list { flex:1; overflow-y:auto; padding:8px; display:flex; flex-direction:column; gap:6px; }
  .sighting-list::-webkit-scrollbar { width:4px; }
  .sighting-list::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
  .card { background:var(--surface2); border:1.5px solid var(--border); border-radius:10px; padding:12px; cursor:pointer; transition:all 0.2s; position:relative; overflow:hidden; }
  .card::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; border-radius:2px 0 0 2px; transition:width 0.2s; }
  .card.type-lost::before { background:var(--red); } .card.type-wild::before { background:var(--blue); } .card.type-protected::before { background:var(--green); }
  .card:hover { border-color:var(--accent); transform:translateX(2px); }
  .card.selected { border-color:var(--accent); background:rgba(240,180,41,0.07); transform:translateX(4px); box-shadow:0 0 0 1px rgba(240,180,41,0.2),0 4px 20px rgba(0,0,0,0.3); }
  .card.selected::before { width:5px; }
  .card-header { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:6px; }
  .card-type { font-size:10px; font-weight:700; letter-spacing:0.8px; text-transform:uppercase; padding:2px 7px; border-radius:4px; }
  .type-lost .card-type { color:var(--red); background:var(--red-dim); } .type-wild .card-type { color:var(--blue); background:var(--blue-dim); } .type-protected .card-type { color:var(--green); background:var(--green-dim); }
  .card-time { font-family:'DM Mono',monospace; font-size:10px; color:var(--text-muted); }
  .card-desc { font-size:12px; color:var(--text); line-height:1.5; margin-bottom:8px; }
  .card-footer { display:flex; align-items:center; justify-content:space-between; }
  .card-location { font-size:11px; color:var(--text-muted); }
  .card-trust { font-family:'DM Mono',monospace; font-size:10px; color:var(--accent); }
  .map-container { flex:1; position:relative; overflow:hidden; background:#141824; }
  canvas.map-canvas { position:absolute; inset:0; width:100%; height:100%; }
  #pins { position:absolute; inset:0; pointer-events:none; }
  .drop-zone { position:absolute; inset:0; z-index:5; pointer-events:none; transition:background 0.2s; }
  .drop-zone.active { pointer-events:all; background:rgba(240,180,41,0.04); border:2px dashed rgba(240,180,41,0.5); }
  .drop-hint { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:13px; font-weight:700; color:var(--accent); background:rgba(15,17,23,0.88); padding:10px 20px; border-radius:10px; border:1px solid rgba(240,180,41,0.3); pointer-events:none; opacity:0; transition:opacity 0.2s; white-space:nowrap; }
  .drop-zone.active .drop-hint { opacity:1; }
  .pin { position:absolute; transform:translate(-50%,-100%); cursor:pointer; z-index:10; pointer-events:all; transition:transform 0.25s cubic-bezier(0.34,1.56,0.64,1),filter 0.2s,opacity 0.2s; }
  .pin:hover { transform:translate(-50%,-100%) scale(1.2); z-index:20; }
  .pin.selected { transform:translate(-50%,-100%) scale(1.45); z-index:30; filter:drop-shadow(0 0 14px currentColor); }
  .pin.dimmed { opacity:0.25; pointer-events:none; }
  .pin-body { width:32px; height:38px; position:relative; display:flex; align-items:center; justify-content:center; }
  .pin-bg { position:absolute; inset:0; border-radius:50% 50% 50% 0; transform:rotate(-45deg); border:2px solid rgba(255,255,255,0.2); transition:outline 0.15s; }
  .pin-icon { position:relative; z-index:1; font-size:14px; margin-top:-4px; }
  .pin-lost { color:var(--red); } .pin-wild { color:var(--blue); } .pin-protected { color:var(--green); }
  .pin-lost .pin-bg { background:var(--red); box-shadow:0 4px 16px rgba(255,77,109,0.5); }
  .pin-wild .pin-bg { background:var(--blue); box-shadow:0 4px 16px rgba(77,166,255,0.5); }
  .pin-protected .pin-bg { background:var(--green); box-shadow:0 4px 16px rgba(61,220,132,0.5); }
  .pin.selected .pin-bg { outline:3px solid rgba(255,255,255,0.7); outline-offset:2px; }
  .pin-pulse { position:absolute; inset:-8px; border-radius:50%; animation:pulse 2.5s ease-out infinite; pointer-events:none; }
  .pin-lost .pin-pulse { background:radial-gradient(circle,rgba(255,77,109,0.3) 0%,transparent 70%); }
  .pin-wild .pin-pulse { background:radial-gradient(circle,rgba(77,166,255,0.3) 0%,transparent 70%); }
  .pin-protected .pin-pulse { background:radial-gradient(circle,rgba(61,220,132,0.3) 0%,transparent 70%); }
  @keyframes pulse { 0%{transform:scale(0.8);opacity:1} 100%{transform:scale(2.2);opacity:0} }
  @keyframes pinDrop { from{transform:translate(-50%,-200%);opacity:0} to{transform:translate(-50%,-100%);opacity:1} }
  .pin { animation:pinDrop 0.4s cubic-bezier(0.34,1.56,0.64,1) both; }
  .pin.selected,.pin.dimmed { animation:none; }
  .tooltip { position:absolute; bottom:44px; left:50%; transform:translateX(-50%); background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:8px 12px; font-size:11px; white-space:nowrap; pointer-events:none; opacity:0; transition:opacity 0.15s; z-index:50; min-width:140px; text-align:center; }
  .pin:hover .tooltip { opacity:1; }
  .tooltip-title { font-weight:700; margin-bottom:2px; }
  .tooltip-time { color:var(--text-muted); font-family:'DM Mono',monospace; font-size:10px; }
  .map-controls { position:absolute; top:16px; right:16px; display:flex; flex-direction:column; gap:4px; z-index:50; }
  .map-btn { width:36px; height:36px; background:var(--surface); border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.15s; }
  .map-btn:hover { border-color:var(--accent); color:var(--accent); }
  .map-info { position:absolute; bottom:16px; left:16px; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:8px 14px; font-size:11px; color:var(--text-muted); display:flex; align-items:center; gap:14px; z-index:50; }
  .legend-item { display:flex; align-items:center; gap:5px; font-weight:700; }
  .drag-palette { position:absolute; bottom:16px; right:16px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 14px 18px; z-index:60; display:flex; flex-direction:column; gap:8px; box-shadow:0 4px 24px rgba(0,0,0,0.4); }
  .palette-title { font-size:10px; font-weight:700; letter-spacing:1px; color:var(--text-muted); text-transform:uppercase; text-align:center; }
  .palette-pins { display:flex; gap:10px; }
  .palette-pin { width:44px; height:44px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:22px; cursor:grab; border:1.5px solid var(--border); transition:all 0.15s; position:relative; }
  .palette-pin:hover { transform:scale(1.12); border-color:var(--accent); }
  .palette-pin.p-lost { background:var(--red-dim); border-color:var(--red); }
  .palette-pin.p-wild { background:var(--blue-dim); border-color:var(--blue); }
  .palette-pin.p-protected { background:var(--green-dim); border-color:var(--green); }
  .palette-label { position:absolute; bottom:-17px; left:50%; transform:translateX(-50%); font-size:9px; color:var(--text-muted); white-space:nowrap; font-weight:700; }
  .drag-ghost { position:fixed; pointer-events:none; z-index:9999; transform:translate(-50%,-100%); display:none; }
  .drag-ghost.active { display:block; }
  .drag-ghost .pin-body { width:36px; height:42px; }
  .drag-ghost .pin-icon { font-size:16px; }
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); backdrop-filter:blur(4px); z-index:200; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity 0.2s; }
  .modal-overlay.open { opacity:1; pointer-events:all; }
  .modal { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:28px; width:400px; max-width:95vw; transform:translateY(20px); transition:transform 0.2s; }
  .modal-overlay.open .modal { transform:translateY(0); }
  .modal h2 { font-size:18px; font-weight:900; margin-bottom:4px; }
  .modal-sub { font-size:12px; color:var(--text-muted); margin-bottom:16px; }
  .placed-pos { display:flex; align-items:center; gap:8px; margin-bottom:14px; background:rgba(240,180,41,0.1); border:1px solid rgba(240,180,41,0.3); border-radius:8px; padding:8px 12px; font-size:12px; color:var(--accent); }
  .form-group { margin-bottom:14px; }
  label { display:block; font-size:11px; font-weight:700; letter-spacing:0.8px; color:var(--text-muted); text-transform:uppercase; margin-bottom:6px; }
  .type-select { display:flex; gap:6px; margin-bottom:14px; }
  .type-option { flex:1; padding:8px 4px; border-radius:8px; border:1.5px solid var(--border); background:transparent; color:var(--text-muted); font-family:inherit; font-size:11px; font-weight:700; cursor:pointer; transition:all 0.15s; text-align:center; }
  .type-option.sel-lost { border-color:var(--red); color:var(--red); background:var(--red-dim); }
  .type-option.sel-wild { border-color:var(--blue); color:var(--blue); background:var(--blue-dim); }
  .type-option.sel-protected { border-color:var(--green); color:var(--green); background:var(--green-dim); }
  textarea,input[type="text"] { width:100%; background:var(--surface2); border:1.5px solid var(--border); border-radius:8px; color:var(--text); font-family:inherit; font-size:13px; padding:10px 12px; resize:none; outline:none; transition:border-color 0.15s; }
  textarea:focus,input[type="text"]:focus { border-color:var(--accent); }
  textarea { height:72px; }
  .photo-upload { border:1.5px dashed var(--border); border-radius:8px; padding:20px; text-align:center; cursor:pointer; transition:all 0.15s; color:var(--text-muted); font-size:12px; }
  .photo-upload:hover { border-color:var(--accent); color:var(--accent); }
  .photo-upload .icon { font-size:24px; margin-bottom:4px; }
  .modal-footer { display:flex; gap:10px; margin-top:20px; }
  .btn-cancel { flex:1; padding:10px; border-radius:8px; border:1.5px solid var(--border); background:transparent; color:var(--text-muted); font-family:inherit; font-weight:700; font-size:13px; cursor:pointer; transition:all 0.15s; }
  .btn-cancel:hover { border-color:var(--text-muted); color:var(--text); }
  .btn-submit { flex:2; padding:10px; border-radius:8px; border:none; background:var(--accent); color:#0f1117; font-family:inherit; font-weight:700; font-size:13px; cursor:pointer; transition:opacity 0.15s; }
  .btn-submit:hover { opacity:0.85; }
  .toast { position:fixed; bottom:24px; right:24px; background:var(--surface); border:1px solid var(--green); border-radius:10px; padding:12px 18px; font-size:13px; font-weight:700; color:var(--green); z-index:300; transform:translateY(80px); opacity:0; transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1); }
  .toast.show { transform:translateY(0); opacity:1; }
  .loading { position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:999; flex-direction:column; gap:12px; font-size:14px; color:var(--text-muted); }
  .loading-spinner { width:32px; height:32px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin 0.8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>

<!-- Loading screen -->
<div class="loading" id="loading">
  <div class="loading-spinner"></div>
  <div>データを読み込み中...</div>
</div>

<header>
  <div class="logo"><span style="font-size:22px">🐾</span> Neko<span>Map</span></div>
  <button class="btn-post" onclick="openModal(null)">＋ 目撃情報を投稿</button>
</header>

<div class="main">
  <div class="sidebar">
    <div class="filter-bar">
      <div class="filter-title">フィルター</div>
      <div class="filter-chips">
        <div class="chip active-red"   onclick="toggleFilter('lost',this)"><div class="dot dot-red"></div>迷い猫</div>
        <div class="chip active-blue"  onclick="toggleFilter('wild',this)"><div class="dot dot-blue"></div>野良猫</div>
        <div class="chip active-green" onclick="toggleFilter('protected',this)"><div class="dot dot-green"></div>保護済み</div>
      </div>
      <div class="time-filter">
        <button class="time-btn active" onclick="setTime('24h',this)">24時間</button>
        <button class="time-btn" onclick="setTime('3d',this)">3日</button>
        <button class="time-btn" onclick="setTime('week',this)">1週間</button>
        <button class="time-btn" onclick="setTime('all',this)">全て</button>
      </div>
    </div>
    <div class="sighting-list" id="list"></div>
  </div>

  <div class="map-container" id="mapContainer">
    <canvas class="map-canvas" id="mapCanvas"></canvas>
    <div id="pins"></div>
    <div class="drop-zone" id="dropZone"><div class="drop-hint">🐾 ここに置いて位置を確定</div></div>
    <div class="map-controls">
      <button class="map-btn">📍</button>
      <button class="map-btn">＋</button>
      <button class="map-btn">－</button>
    </div>
    <div class="map-info">
      <div class="legend-item"><div class="dot dot-red"></div>迷い猫</div>
      <div class="legend-item"><div class="dot dot-blue"></div>野良猫</div>
      <div class="legend-item"><div class="dot dot-green"></div>保護済み</div>
    </div>
    <div class="drag-palette">
      <div class="palette-title">ドラッグして投稿</div>
      <div class="palette-pins">
        <div class="palette-pin p-lost"      data-type="lost">🐱<span class="palette-label">迷い猫</span></div>
        <div class="palette-pin p-wild"      data-type="wild">🐾<span class="palette-label">野良猫</span></div>
        <div class="palette-pin p-protected" data-type="protected">🏠<span class="palette-label">保護済み</span></div>
      </div>
    </div>
  </div>
</div>

<div class="drag-ghost" id="dragGhost">
  <div class="pin-body">
    <div class="pin-bg" id="ghostBg"></div>
    <div class="pin-icon" id="ghostIcon"></div>
  </div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2>🐱 目撃情報を投稿</h2>
    <div class="modal-sub">詳細を入力してください</div>
    <div class="placed-pos" id="placedPos" style="display:none">📍 マップ上に位置を配置済み</div>
    <div class="form-group">
      <label>種別</label>
      <div class="type-select">
        <button class="type-option"          onclick="selectType('lost',this)">🔴 迷い猫</button>
        <button class="type-option sel-wild" onclick="selectType('wild',this)">🔵 野良猫</button>
        <button class="type-option"          onclick="selectType('protected',this)">🟢 保護済み</button>
      </div>
    </div>
    <div class="form-group">
      <label>特徴・メモ</label>
      <textarea id="desc" placeholder="例：黒白、首輪なし、人懐っこい。公園のベンチ付近にいた。"></textarea>
    </div>
    <div class="form-group">
      <label>場所（任意）</label>
      <input type="text" id="loc" placeholder="例：渋谷区代々木公園 南門付近">
    </div>
    <div class="form-group">
      <label>写真</label>
      <div class="photo-upload"><div class="icon">📷</div>タップして写真を追加（デモでは省略）</div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">キャンセル</button>
      <button class="btn-submit" onclick="submitPost()">投稿する</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">✅ 投稿しました！Firebaseに保存されました</div>

<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* ── Firebase設定 ── */
const firebaseConfig = {
  apiKey: "AIzaSyC6i63nErkPtYDNqo-uhxzpNfwurpH4q9k",
  authDomain: "nekomap-870a6.firebaseapp.com",
  projectId: "nekomap-870a6",
  storageBucket: "nekomap-870a6.firebasestorage.app",
  messagingSenderId: "725076410514",
  appId: "1:725076410514:web:0a298b3c0700389adea64b",
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

/* ── STATE ── */
let DATA        = [];
let filters     = {lost:true, wild:true, protected:true};
let selectedId  = null;
let selectedType= 'wild';
let pendingX    = null;
let pendingY    = null;

const typeEmoji = {lost:'🐱', wild:'🐾', protected:'🏠'};
const typeLabel = {lost:'迷い猫', wild:'野良猫', protected:'保護済み'};
const pinColors = {lost:'var(--red)', wild:'var(--blue)', protected:'var(--green)'};

/* ── TIME DISPLAY ── */
function timeAgo(ts) {
  if (!ts) return 'たった今';
  const diff = Date.now() - ts.toMillis();
  const m = Math.floor(diff/60000);
  if (m < 1)  return 'たった今';
  if (m < 60) return `${m}分前`;
  const h = Math.floor(m/60);
  if (h < 24) return `${h}時間前`;
  return `${Math.floor(h/24)}日前`;
}

/* ── MAP ── */
function drawMap() {
  const canvas=document.getElementById('mapCanvas'), cont=document.getElementById('mapContainer');
  canvas.width=cont.offsetWidth; canvas.height=cont.offsetHeight;
  const ctx=canvas.getContext('2d'), W=canvas.width, H=canvas.height;
  ctx.fillStyle='#141824'; ctx.fillRect(0,0,W,H);
  [[0.1,0.1,0.25,0.35],[0.3,0.05,0.5,0.2],[0.55,0.1,0.75,0.3],[0.8,0.15,0.95,0.4],
   [0.05,0.45,0.2,0.65],[0.25,0.4,0.5,0.6],[0.55,0.42,0.72,0.62],[0.78,0.48,0.93,0.68],
   [0.1,0.72,0.35,0.9],[0.42,0.68,0.65,0.88],[0.7,0.72,0.9,0.9],[0.15,0.22,0.28,0.38],
   [0.52,0.28,0.62,0.42],[0.35,0.25,0.48,0.38]
  ].forEach(([x1,y1,x2,y2])=>{
    ctx.fillStyle='#1a1f30'; ctx.strokeStyle='#222840'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.roundRect(x1*W+2,y1*H+2,(x2-x1)*W-4,(y2-y1)*H-4,4); ctx.fill(); ctx.stroke();
  });
  ctx.strokeStyle='#1e2438'; ctx.lineWidth=8;
  [[[0,0.2],[1,0.2]],[[0,0.4],[1,0.4]],[[0,0.65],[1,0.65]],[[0.15,0],[0.15,1]],
   [[0.35,0],[0.35,1]],[[0.55,0],[0.55,1]],[[0.78,0],[0.78,1]],[[0,0.55],[0.35,0.55]],[[0.55,0.55],[1,0.55]]
  ].forEach(pts=>{ctx.beginPath();ctx.moveTo(pts[0][0]*W,pts[0][1]*H);pts.slice(1).forEach(p=>ctx.lineTo(p[0]*W,p[1]*H));ctx.stroke();});
  ctx.strokeStyle='#191e2e'; ctx.lineWidth=4;
  [[[0,0.3],[1,0.3]],[[0,0.75],[1,0.75]],[[0.25,0],[0.25,1]],[[0.65,0],[0.65,1]]
  ].forEach(pts=>{ctx.beginPath();ctx.moveTo(pts[0][0]*W,pts[0][1]*H);pts.slice(1).forEach(p=>ctx.lineTo(p[0]*W,p[1]*H));ctx.stroke();});
  ctx.fillStyle='rgba(61,220,132,0.04)'; ctx.strokeStyle='rgba(61,220,132,0.1)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.roundRect(0.32*W,0.22*H,0.18*W,0.16*H,8); ctx.fill(); ctx.stroke();
  ctx.fillStyle='rgba(61,220,132,0.12)'; ctx.font='10px Zen Kaku Gothic New'; ctx.fillText('公園',0.38*W,0.32*H);
}

/* ── RENDER ── */
function render() {
  const list=document.getElementById('list'), pins=document.getElementById('pins');
  list.innerHTML=''; pins.innerHTML='';
  DATA.forEach((d,i)=>{
    if(!filters[d.type]) return;
    const isSel=selectedId===d.id, isDimmed=selectedId!==null&&!isSel;
    const timeStr = d.createdAt ? timeAgo(d.createdAt) : 'たった今';

    const card=document.createElement('div');
    card.className=`card type-${d.type}${isSel?' selected':''}`;
    card.dataset.id=d.id;
    card.innerHTML=`
      <div class="card-header"><div class="card-type">${typeLabel[d.type]}</div><div class="card-time">${timeStr}</div></div>
      <div class="card-desc">${d.desc}</div>
      <div class="card-footer"><div class="card-location">📍 ${d.loc}</div><div class="card-trust">★ ${d.trust||5.0}</div></div>`;
    card.addEventListener('click',()=>selectPin(d.id));
    list.appendChild(card);

    const pin=document.createElement('div');
    pin.className=`pin pin-${d.type}${isSel?' selected':''}${isDimmed?' dimmed':''}`;
    pin.style.cssText=`left:${d.x*100}%;top:${d.y*100}%;animation-delay:${i*0.07}s`;
    pin.dataset.id=d.id;
    pin.innerHTML=`
      <div class="pin-pulse"></div>
      <div class="pin-body"><div class="pin-bg"></div><div class="pin-icon">${typeEmoji[d.type]}</div></div>
      <div class="tooltip"><div class="tooltip-title">${typeLabel[d.type]}</div><div class="tooltip-time">${timeStr} · ${d.loc}</div></div>`;
    pin.addEventListener('click',e=>{e.stopPropagation();selectPin(d.id);});
    pins.appendChild(pin);
  });
}

/* ── SELECT ── */
function selectPin(id) {
  selectedId=(selectedId===id)?null:id;
  render();
  if(!selectedId) return;
  const card=document.querySelector('.card.selected');
  if(card) card.scrollIntoView({behavior:'smooth',block:'nearest'});
  const pin=document.querySelector(`.pin[data-id="${selectedId}"]`);
  if(pin){
    pin.style.transition='transform 0.35s cubic-bezier(0.34,1.9,0.64,1)';
    pin.style.transform='translate(-50%,-100%) scale(1.75)';
    setTimeout(()=>{pin.style.transform='translate(-50%,-100%) scale(1.45)';},350);
  }
}

/* ── DRAG ── */
let dragType=null, isDragging=false;
const ghost=document.getElementById('dragGhost');
const ghostBg=document.getElementById('ghostBg');
const ghostIcon=document.getElementById('ghostIcon');
const dropZone=document.getElementById('dropZone');

function startDrag(type,cx,cy){
  dragType=type; isDragging=true;
  ghostBg.style.background=pinColors[type]; ghostBg.style.boxShadow=`0 4px 20px ${pinColors[type]}`;
  ghostIcon.textContent=typeEmoji[type];
  ghost.classList.add('active'); dropZone.classList.add('active');
  ghost.style.left=cx+'px'; ghost.style.top=cy+'px';
}
function moveDrag(cx,cy){ ghost.style.left=cx+'px'; ghost.style.top=cy+'px'; }
function endDrag(cx,cy){
  if(!isDragging) return;
  ghost.classList.remove('active'); dropZone.classList.remove('active');
  const cont=document.getElementById('mapContainer'), r=cont.getBoundingClientRect();
  if(cx>=r.left&&cx<=r.right&&cy>=r.top&&cy<=r.bottom){
    pendingX=(cx-r.left)/r.width; pendingY=(cy-r.top)/r.height;
    openModal(dragType);
  }
  isDragging=false; dragType=null;
}

document.querySelectorAll('.palette-pin').forEach(el=>{
  el.addEventListener('mousedown',e=>{startDrag(el.dataset.type,e.clientX,e.clientY);e.preventDefault();});
  el.addEventListener('touchstart',e=>{const t=e.touches[0];startDrag(el.dataset.type,t.clientX,t.clientY);e.preventDefault();},{passive:false});
});
document.addEventListener('mousemove',e=>{if(isDragging)moveDrag(e.clientX,e.clientY);});
document.addEventListener('touchmove',e=>{if(isDragging){const t=e.touches[0];moveDrag(t.clientX,t.clientY);e.preventDefault();}},{passive:false});
document.addEventListener('mouseup',e=>endDrag(e.clientX,e.clientY));
document.addEventListener('touchend',e=>{const t=e.changedTouches[0];endDrag(t.clientX,t.clientY);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&isDragging){isDragging=false;dragType=null;ghost.classList.remove('active');dropZone.classList.remove('active');}});

/* ── MODAL ── */
function openModal(presetType){
  if(presetType){
    selectedType=presetType;
    const idx=['lost','wild','protected'].indexOf(presetType);
    document.querySelectorAll('.type-option').forEach((b,i)=>{b.className='type-option'+(i===idx?` sel-${presetType}`:'');});
  }
  document.getElementById('placedPos').style.display=(pendingX!==null)?'flex':'none';
  document.getElementById('modal').classList.add('open');
}
function closeModal(){ document.getElementById('modal').classList.remove('open'); pendingX=null; pendingY=null; }
function selectType(type,el){ selectedType=type; document.querySelectorAll('.type-option').forEach(b=>b.className='type-option'); if(el)el.className=`type-option sel-${type}`; }

/* ── SUBMIT → Firebase ── */
async function submitPost(){
  const desc=document.getElementById('desc').value.trim();
  const loc=document.getElementById('loc').value.trim()||'現在地付近';
  if(!desc){document.getElementById('desc').focus();return;}
  const item={
    type:selectedType, desc, loc, trust:5.0,
    x:pendingX!==null?pendingX:0.2+Math.random()*0.6,
    y:pendingY!==null?pendingY:0.15+Math.random()*0.65,
    createdAt:serverTimestamp(),
  };
  try {
    await addDoc(collection(db,'sightings'), item);
    closeModal();
    document.getElementById('desc').value='';
    document.getElementById('loc').value='';
    const toast=document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(()=>toast.classList.remove('show'),3000);
  } catch(e) {
    alert('投稿に失敗しました: '+e.message);
  }
}

/* ── MISC ── */
function toggleFilter(type,el){ filters[type]=!filters[type]; const m={lost:'active-red',wild:'active-blue',protected:'active-green'}; el.classList.toggle(m[type],filters[type]); render(); }
function setTime(t,el){ document.querySelectorAll('.time-btn').forEach(b=>b.classList.remove('active')); el.classList.add('active'); }

document.getElementById('mapContainer').addEventListener('click',e=>{
  if(e.target.closest('.pin,.drag-palette,.map-controls,.map-info')) return;
  if(selectedId!==null){selectedId=null;render();}
});

// グローバルに公開
window.openModal=openModal; window.closeModal=closeModal; window.selectType=selectType;
window.submitPost=submitPost; window.toggleFilter=toggleFilter; window.setTime=setTime;

/* ── FIREBASE REALTIME LISTENER ── */
const q = query(collection(db,'sightings'), orderBy('createdAt','desc'));
onSnapshot(q, (snapshot)=>{
  DATA = snapshot.docs.map(doc=>({id:doc.id, ...doc.data()}));
  render();
  document.getElementById('loading').style.display='none';
});

drawMap();
window.addEventListener('resize',()=>{drawMap();render();});
</script>
</body>
